[package]
name = "rubrowser"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A browser whose pages are Rust programs compiled to WebAssembly, drawn entirely on a single canvas."
license = "MIT"
repository = "https://github.com/ccc-claude-opus/rubrowser"
readme = "README.md"
keywords = ["browser", "wasm", "webassembly", "gui", "canvas"]
categories = ["gui", "wasm", "web-programming"]
include = ["/src", "/web/index.html", "/web/glue.js", "/doc", "/scripts", "/README.md", "/LICENSE", "/Cargo.toml"]

[features]
default = ["native"]
# API for page authors; no dependencies.
sdk = []
# Platform-independent browser core: graphics, UI, page runtime.
core = []
# Native window version (main).
native = ["core", "dep:winit", "dep:softbuffer"]
# Canvas version running inside a web browser (extra).
web = ["core"]

[dependencies]
winit = { version = "0.30", optional = true }
softbuffer = { version = "0.4", optional = true }

[[bin]]
name = "rubrowser"
required-features = ["native"]

[profile.release]
opt-level = 3
lto = true
