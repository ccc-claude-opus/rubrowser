[package]
name = "rubrowser"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
description = "A browser whose pages are Rust programs compiled to WebAssembly, drawn entirely on a single canvas."
license = "MIT"
repository = "https://github.com/ccc-claude-opus/rubrowser"
readme = "README.md"
keywords = ["browser", "wasm", "webassembly", "gui", "canvas"]
categories = ["gui", "wasm", "web-programming"]
include = ["/src", "/examples", "/web/index.html", "/web/glue.js", "/doc", "/scripts", "/README.md", "/LICENSE", "/Cargo.toml"]

[features]
default = ["native"]
# API for page authors; no dependencies.
sdk = []
# Platform-independent browser core: graphics, UI, page runtime.
core = [
    "dep:wasmi",
    "dep:fontdue",
    "dep:dejavu",
    "dep:html5ever",
    "dep:csscolorparser",
    "dep:taffy",
    "dep:image",
]
# Native window version (main).
native = ["core", "dep:winit", "dep:softbuffer", "dep:ureq", "dep:arboard"]
# Canvas version running inside a web browser (extra).
web = ["core"]
# The JavaScript runtime (boa) built as js.wasm; see scripts/build.sh.
js-runtime = ["sdk", "dep:boa_engine", "dep:getrandom"]

[dependencies]
winit = { version = "0.30", optional = true }
softbuffer = { version = "0.4", optional = true }
wasmi = { version = "2", default-features = false, features = ["std", "stable", "validate", "auto-dispatch"], optional = true }
ureq = { version = "3", optional = true }
arboard = { version = "3", default-features = false, optional = true }
fontdue = { version = "0.9", optional = true }
dejavu = { version = "2.37", optional = true }
html5ever = { version = "0.40", optional = true }
csscolorparser = { version = "0.9", optional = true }
taffy = { version = "0.15", features = ["parse"], optional = true }
boa_engine = { version = "0.22", default-features = false, optional = true }
getrandom = { version = "0.4", default-features = false, optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"], optional = true }

[dev-dependencies]
wasmi = { version = "2", features = ["wat"] }

[[bin]]
name = "rubrowser"
required-features = ["native"]

[profile.release]
opt-level = 3
lto = true

# Small wasm for pages: cargo build --profile page --example NAME ...
[profile.page]
inherits = "release"
opt-level = "s"
panic = "abort"
strip = true
codegen-units = 1

# Page scripts (built for wasm32 by scripts/build.sh).
[[example]]
name = "counter"
crate-type = ["cdylib"]
required-features = ["sdk"]

[[example]]
name = "todo"
crate-type = ["cdylib"]
required-features = ["sdk"]

[[example]]
name = "stopwatch"
crate-type = ["cdylib"]
required-features = ["sdk"]

[[example]]
name = "events"
crate-type = ["cdylib"]
required-features = ["sdk"]

# The JavaScript runtime module (boa compiled to wasm).
[[example]]
name = "js_runtime"
crate-type = ["cdylib"]
required-features = ["js-runtime"]

[package.metadata.docs.rs]
features = ["native", "sdk"]
