<!doctype html>
<html>
<head>
<title>rubrowser</title>
<style>
  html, body { height: 100%; margin: 0; }

  body {
    display: flex;
    flex-direction: column;
    font-family: sans-serif;
    font-size: 13px;
    color: #e8e8e8;
    background: #1e1f22;
  }

  /* Tab strip */
  #tabbar {
    display: flex;
    align-items: flex-end;
    gap: 4px;
    height: 36px;
    padding: 0 8px;
    flex-shrink: 0;
  }
  #tabs {
    display: flex;
    gap: 2px;
    min-width: 0;
    flex-shrink: 1;
    overflow: hidden;
  }
  .tab {
    display: flex;
    align-items: center;
    gap: 6px;
    width: 200px;
    min-width: 48px;
    flex-shrink: 1;
    height: 30px;
    padding: 0 6px 0 12px;
    border-radius: 7px;
    background: #2b2d31;
    color: #9a9da3;
    cursor: default;
  }
  .tab:hover { background: #35373c; }
  .tab.active { background: #3c3f45; color: #ffffff; }
  .tab .title {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
  }
  .tab .close {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    border-radius: 9px;
    font-size: 12px;
  }
  .tab .close:hover { background: #5d6068; color: #ffffff; }

  /* Toolbar */
  #toolbar {
    display: flex;
    align-items: center;
    gap: 4px;
    height: 42px;
    padding: 0 8px;
    flex-shrink: 0;
    background: #3c3f45;
  }
  button {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    flex-shrink: 0;
    padding: 0;
    border: none;
    border-radius: 7px;
    background: transparent;
    color: #e8e8e8;
    font-size: 17px;
  }
  button:hover { background: #4e5158; }
  button:active { background: #5d6068; }
  button.disabled { color: #6b6e74; }
  button.disabled:hover { background: transparent; }
  #new-tab { margin-bottom: 2px; color: #9a9da3; }

  #address {
    flex: 1;
    min-width: 0;
    height: 30px;
    box-sizing: border-box;
    padding: 0 14px;
    border: 2px solid #1e1f22;
    border-radius: 15px;
    background: #1e1f22;
    color: #e8e8e8;
    font-size: 14px;
  }
  #address:focus { border-color: #5b8def; }
  #install { width: auto; padding: 0 12px; background: #2b8a3e; color: #ffffff; border-radius: 15px; }
  #install:hover { background: #37a14d; }
  #install[hidden] { display: none; }

  /* The active tab's page is drawn over this box. */
  #viewport {
    flex: 1;
    min-height: 0;
    background: #ffffff;
  }

  /* Link preview, drawn on top of the page. */
  #status {
    display: none;
    position: absolute;
    left: 0;
    bottom: 0;
    max-width: 60%;
    padding: 3px 10px;
    border-radius: 6px;
    background: #2b2d31;
    color: #e8e8e8;
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
  }
  #status.show { display: block; }

  /* Context menu (right click / Ctrl-click), drawn on top of the page. */
  #menu {
    display: none;
    position: absolute;
    width: 240px;
    box-sizing: border-box;
    padding: 5px 0;
    border: 1px solid #5c5f66;
    border-radius: 8px;
    background: #2b2d31;
    color: #e8e8e8;
    font-size: 13px;
  }
  #menu.show { display: block; }
  #menu .item {
    display: flex;
    justify-content: space-between;
    height: 26px;
    line-height: 26px;
    padding: 0 14px;
    border-radius: 4px;
    margin: 0 5px;
  }
  #menu .item:hover { background: #3a6fe0; color: #ffffff; }
  #menu .item.off { color: #7c7f86; }
  #menu .item.off:hover { background: transparent; color: #7c7f86; }
  #menu .key { color: #9a9ca3; }
  #menu .item:hover .key { color: #ffffff; }
  #menu .sep { height: 1px; margin: 4px 10px; background: #45474d; }

  /* Download bar: where the last download was saved. */
  /* The on-screen keyboard (osk.rs): the page above gets shorter while it is up. */
  #osk {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex-shrink: 0;
    padding: 8px 4px 10px;
    background: #2b2d31;
  }
  #osk[hidden] { display: none; }
  .krow { display: flex; justify-content: center; gap: 5px; }
  .key {
    flex: 1;
    max-width: 72px;
    height: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 7px;
    background: #4a4d53;
    color: #ffffff;
    font-size: 20px;
  }
  .key.fn { background: #36383d; font-size: 15px; }
  .key.on { background: #e8e8e8; color: #1e1f22; }
  .key.lock { text-decoration: underline; }
  .key.space { flex: 4; max-width: 320px; font-size: 14px; color: #c8c8c8; }
  .key.enter { flex: 1.6; max-width: 120px; background: #2b6fdb; }

  #download {
    display: none;
    align-items: center;
    gap: 8px;
    height: 32px;
    padding: 0 8px 0 14px;
    flex-shrink: 0;
    background: #3c3f45;
  }
  #download.show { display: flex; }
  #download-text {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
  }

  /* Developer tools, docked below the page (src/browser/devtools.rs). */
  #devtools {
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    height: 300px;
    background: #202124;
    color: #e3e3e3;
    font-family: monospace;
    font-size: 12px;
  }
  #devtools[hidden] { display: none; }
  #dt-resize { height: 5px; flex-shrink: 0; background: #3c3f45; cursor: row-resize; }
  #dt-bar {
    display: flex;
    align-items: center;
    gap: 2px;
    height: 28px;
    flex-shrink: 0;
    padding: 0 6px;
    background: #2b2d31;
    border-bottom: 1px solid #3c3f45;
    font-family: sans-serif;
  }
  #dt-bar button {
    width: auto;
    height: 24px;
    padding: 0 10px;
    border-radius: 4px;
    font-size: 12px;
    color: #c4c7c5;
  }
  #dt-bar button.on { color: #8ab4f8; background: #35373c; }
  #dt-bar .fill { flex: 1; }
  .dt-panel { display: none; flex: 1; min-height: 0; }
  #devtools.elements #dt-elements { display: flex; }
  #devtools.console #dt-console { display: flex; flex-direction: column; }
  #devtools.network #dt-network { display: flex; }
  #devtools.sources #dt-sources { display: flex; }
  #devtools.application #dt-application { display: flex; flex-direction: column; }
  #devtools.performance #dt-performance { display: flex; }
  #devtools.console #dt-filters { display: flex; }
  #dt-filters { display: none; gap: 2px; }

  #dt-tree { flex: 1; min-width: 0; overflow: auto; padding: 4px 0; }
  .dt-row { white-space: pre; padding-right: 8px; line-height: 18px; }
  .dt-row:hover { background: #2f3238; }
  .dt-row.sel { background: #394457; }
  .dt-tw { display: inline-block; width: 12px; color: #9aa0a6; }
  .dt-tag { color: #5db0d7; }
  .dt-an { color: #9bbbdc; }
  .dt-av { color: #f29766; }
  .dt-text { color: #e3e3e3; }
  .dt-comment { color: #898989; }
  #dt-side {
    display: flex;
    flex-direction: column;
    width: 38%;
    flex-shrink: 0;
    border-left: 1px solid #3c3f45;
  }
  #dt-side-content { flex: 1; min-height: 0; overflow: auto; padding: 4px 8px; }
  .dt-h { margin: 8px 0 3px; color: #9aa0a6; font-family: sans-serif; font-weight: bold; }
  .dt-kv { white-space: pre-wrap; line-height: 17px; }
  .dt-rule { margin-bottom: 6px; }
  .dt-sel { color: #e3e3e3; }
  .dt-src { color: #9aa0a6; }
  .dt-boxm { margin: 4px 0; padding: 6px; background: #f6b26b; color: #202124; text-align: center; }
  .dt-boxm div { margin: 2px 8px 0; padding: 6px; text-align: center; }
  .dt-boxm .b { background: #ffe599; }
  .dt-boxm .p { background: #93c47d; }
  .dt-boxm .c { background: #6fa8dc; }
  .dt-input {
    width: 100%;
    height: 24px;
    flex-shrink: 0;
    box-sizing: border-box;
    padding: 0 8px;
    border: none;
    border-top: 1px solid #3c3f45;
    background: #202124;
    color: #e3e3e3;
    font-family: monospace;
    font-size: 12px;
  }

  #dt-log { flex: 1; min-height: 0; overflow: auto; }
  .dt-msg {
    padding: 2px 8px;
    border-bottom: 1px solid #2f3134;
    white-space: pre-wrap;
    line-height: 17px;
  }
  .dt-msg.warn { background: #413c26; color: #f2d28e; }
  .dt-msg.error { background: #4e3534; color: #f9a9a3; }
  .dt-msg.cmd { color: #8ab4f8; }
  .dt-msg.result { color: #c4c7c5; }
  .dt-count {
    display: inline-block;
    margin-right: 6px;
    padding: 0 5px;
    border-radius: 7px;
    background: #5f6368;
    color: #ffffff;
  }

  #dt-requests { flex: 1; min-width: 0; overflow: auto; }
  #dt-detail {
    display: none;
    width: 50%;
    flex-shrink: 0;
    overflow: auto;
    padding: 4px 8px;
    border-left: 1px solid #3c3f45;
  }
  #dt-detail.show { display: block; }
  .dt-req { display: flex; gap: 8px; padding: 1px 8px; line-height: 18px; white-space: pre; }
  .dt-req:hover { background: #2f3238; }
  .dt-req.sel { background: #394457; }
  .dt-req.fail { color: #f28b82; }
  .dt-req.head { color: #9aa0a6; font-family: sans-serif; border-bottom: 1px solid #3c3f45; }
  .dt-req .name { flex: 1; min-width: 0; overflow: hidden; }
  .dt-req .st { width: 44px; flex-shrink: 0; }
  .dt-req .ty { width: 70px; flex-shrink: 0; overflow: hidden; }
  .dt-req .sz { width: 64px; flex-shrink: 0; text-align: right; }
  .dt-req .tm { width: 56px; flex-shrink: 0; text-align: right; }
  .dt-body { white-space: pre-wrap; padding: 4px; background: #2b2d31; }
  .dt-chk { display: inline-block; width: 14px; color: #9aa0a6; }
  .dt-off { color: #7c7f86; text-decoration: line-through; }

  #dt-files { width: 240px; flex-shrink: 0; overflow: auto; border-right: 1px solid #3c3f45; }
  .dt-file { padding: 2px 8px; line-height: 18px; white-space: nowrap; overflow: hidden; }
  .dt-file:hover { background: #2f3238; }
  .dt-file.sel { background: #394457; }
  .dt-kind { display: inline-block; width: 34px; color: #9aa0a6; font-size: 10px; }
  .dt-kind.script { color: #f2d28e; }
  .dt-kind.stylesheet { color: #8ab4f8; }
  #dt-code { display: flex; flex: 1; min-width: 0; overflow: auto; }
  #dt-code pre { margin: 0; padding: 4px 8px; line-height: 16px; font-size: 12px; }
  .dt-ln { color: #6e7175; text-align: right; border-right: 1px solid #3c3f45; flex-shrink: 0; }
  .dt-code-text { flex: 1; }

  #dt-store { flex: 1; min-height: 0; overflow: auto; padding: 0 8px 6px; }
  .dt-app-bar { padding-top: 6px; }
  .dt-app-bar button { display: inline-flex; width: auto; height: 22px; padding: 0 10px; font-size: 12px; background: #35373c; border-radius: 4px; }
  .dt-kvrow { display: flex; gap: 10px; line-height: 18px; white-space: nowrap; }
  .dt-kvrow:hover { background: #2f3238; }
  .dt-x { width: 14px; flex-shrink: 0; color: #9aa0a6; text-align: center; }
  .dt-x:hover { color: #f28b82; }
  .dt-kvrow .dt-an { width: 30%; flex-shrink: 0; overflow: hidden; }
  .dt-v { flex: 1; min-width: 0; overflow: hidden; }

  #dt-perf { flex: 1; min-width: 0; overflow: auto; padding: 0 8px 6px; }
  .dt-bars { display: flex; align-items: flex-end; gap: 1px; height: 64px; padding: 2px 0; border-bottom: 1px solid #3c3f45; }
  .dt-bar { display: flex; flex-direction: column; justify-content: flex-end; width: 5px; }
  .dt-bar .u { background: #8ab4f8; }
  .dt-bar .p { background: #81c995; }
</style>
</head>
<body>
  <div id="tabbar">
    <div id="tabs"></div>
    <button id="new-tab" data-action="new-tab">+</button>
  </div>
  <div id="toolbar">
    <button id="back" data-action="back">&#x2190;</button>
    <button id="forward" data-action="forward">&#x2192;</button>
    <button id="reload" data-action="reload">&#x21bb;</button>
    <input id="address" placeholder="Enter an address">
    <button id="install" data-action="install" hidden>安裝</button>
  </div>
  <div id="viewport"></div>
  <div id="devtools" class="elements" hidden>
    <div id="dt-resize" data-dt="resize"></div>
    <div id="dt-bar">
      <button id="dt-inspect" data-dt="inspect" title="Select an element in the page">&#x2b1a;</button>
      <button id="dt-tab-elements" data-dt="panel:elements">Elements</button>
      <button id="dt-tab-console" data-dt="panel:console">Console</button>
      <button id="dt-tab-network" data-dt="panel:network">Network</button>
      <button id="dt-tab-sources" data-dt="panel:sources">Sources</button>
      <button id="dt-tab-application" data-dt="panel:application">Application</button>
      <button id="dt-tab-performance" data-dt="panel:performance">Performance</button>
      <span id="dt-filters"><button id="dt-f-all" data-dt="filter:all">All</button><button id="dt-f-warn" data-dt="filter:warn">Warnings</button><button id="dt-f-error" data-dt="filter:error">Errors</button></span>
      <span class="fill"></span>
      <button id="dt-clear" data-dt="clear" title="Clear">&#x2298;</button>
      <button id="dt-close" data-dt="close" title="Close">&#x2715;</button>
    </div>
    <div id="dt-elements" class="dt-panel">
      <div id="dt-tree"></div>
      <div id="dt-side">
        <div id="dt-side-content"></div>
        <input id="dt-edit" class="dt-input" placeholder="name=value: set an attribute (-name removes)">
      </div>
    </div>
    <div id="dt-console" class="dt-panel">
      <div id="dt-log"></div>
      <input id="dt-input" class="dt-input" placeholder="&#x203a; JavaScript">
    </div>
    <div id="dt-network" class="dt-panel">
      <div id="dt-requests"></div>
      <div id="dt-detail"></div>
    </div>
    <div id="dt-sources" class="dt-panel">
      <div id="dt-files"></div>
      <div id="dt-code"></div>
    </div>
    <div id="dt-application" class="dt-panel">
      <div id="dt-store"></div>
      <input id="dt-app-edit" class="dt-input" placeholder="key=value: set localStorage (session key=value: sessionStorage)">
    </div>
    <div id="dt-performance" class="dt-panel">
      <div id="dt-perf"></div>
    </div>
  </div>
  <div id="osk" hidden></div>
  <div id="download"><span id="download-text"></span><button id="download-close" data-action="close-download">&#x2715;</button></div>
  <div id="status"></div>
  <div id="menu" role="menu"></div>
</body>
</html>
