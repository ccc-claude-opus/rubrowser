<!doctype html>
<html>
<head>
<title>Todo</title>
<style>
  body { font-family: sans-serif; margin: 0; padding: 48px; background: #f6f7f9; color: #202124; }
  .card { max-width: 480px; padding: 24px; background: #fff; border: 1px solid #dadce0; border-radius: 12px; }
  h1 { font-size: 22px; margin: 0 0 16px 0; }
  .row { display: flex; gap: 8px; }
  #new { flex: 1; font-size: 15px; padding: 6px 10px; border-radius: 6px; }
  #add { font-size: 15px; padding: 6px 16px; border-radius: 6px; background: #1a73e8; color: #fff; border: none; }
  #add:hover { background: #1765cc; }
  ul { list-style: none; padding: 0; margin: 16px 0 8px 0; }
  .item { display: flex; align-items: center; padding: 8px 4px; border-bottom: 1px solid #eceef1; }
  .label { flex: 1; cursor: pointer; font-size: 15px; }
  .done .label { color: #9aa0a6; text-decoration: line-through; }
  .delete { border: none; background: transparent; color: #9aa0a6; font-size: 14px; border-radius: 4px; }
  .delete:hover { background: #fce8e6; color: #c5221f; }
  #left { color: #5f6368; font-size: 13px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Todo</h1>
    <div class="row">
      <input id="new" placeholder="What needs to be done?">
      <button id="add">Add</button>
    </div>
    <ul id="list"></ul>
    <div id="left"></div>
  </div>
  <script type="application/wasm" src="todo.wasm"></script>
</body>
</html>
