<!doctype html>
<html>
<head>
<title>Stopwatch</title>
<style>
  body { font-family: sans-serif; margin: 0; padding: 48px; background: #202124; color: #e8eaed; }
  #time { font-family: monospace; font-size: 72px; margin: 0 0 24px 0; }
  .row { display: flex; gap: 12px; }
  button { font-size: 18px; padding: 10px 28px; border-radius: 24px; border: none;
           background: #3c4043; color: #e8eaed; }
  button:hover { background: #4a4e52; }
  #toggle.running { background: #8c1d18; }
  #toggle.running:hover { background: #a52a24; }
  p { color: #9aa0a6; margin-top: 32px; }
</style>
</head>
<body>
  <div id="time">00:00.0</div>
  <div class="row">
    <button id="toggle">Start</button>
    <button id="reset">Reset</button>
  </div>
  <p>Updated by a <code>set_interval</code> timer in <code>stopwatch.wasm</code>.</p>
  <script type="application/wasm" src="stopwatch.wasm"></script>
</body>
</html>
